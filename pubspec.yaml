name: smart_vision
description: "تطبيق الرؤية الذكية لمساعدة المكفوفين وضعاف البصر."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.1 <3.9.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  camera: 0.11.2+1
  firebase_core: 3.13.1
  firebase_auth: 5.5.4
  firebase_storage: 12.4.6
  cloud_firestore: 5.6.8
  cloud_functions: 5.5.1
  firebase_app_check: 0.3.2+6
  speech_to_text: 7.4.0
  flutter_tts: 4.2.5
  tflite_flutter: 0.12.1
  image: 4.10.1
  shared_preferences: 2.5.3
  package_info_plus: 8.3.0
  permission_handler: 11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  flutter_launcher_icons: 0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png
  remove_alpha_ios: true
  background_color: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
  fonts:
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
